# Release config for brunnr-code. No minisign signing and no Homebrew tap:
# the self-upgrade path fails closed (no embedded trust anchors) and users
# reinstall with scripts/install.sh instead.
version: 2

project_name: brunnr-code

builds:
  - main: ./cmd/brunnr-code
    binary: brunnr-code
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
